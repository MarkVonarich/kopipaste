server {
    listen 443 ssl http2;
    server_name app.example.com;

    root /srv/finuchet-miniapp/frontend/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org; frame-ancestors https://web.telegram.org https://*.telegram.org;" always;

    location /miniapp/api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        limit_req zone=miniapp_write burst=20 nodelay;
    }

    location /miniapp/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org; frame-ancestors https://web.telegram.org https://*.telegram.org;" always;
        add_header Cache-Control "public, max-age=86400" always;
        return 204;
    }

    location ~ ^/(?:\.env(?:\..*)?|\.git(?:/.*)?|config/\.env|app/\.env|api/\.env|application/\.env|functions/\.env)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org; frame-ancestors https://web.telegram.org https://*.telegram.org;" always;
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org; frame-ancestors https://web.telegram.org https://*.telegram.org;" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://telegram.org; frame-ancestors https://web.telegram.org https://*.telegram.org;" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
